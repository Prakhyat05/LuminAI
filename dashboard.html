<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LuminAI Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e2e2e2",
                        "secondary": "#5f5e5e",
                        "inverse-primary": "#b6c4ff",
                        "inverse-surface": "#2f3131",
                        "outline-variant": "#c3c5d9",
                        "on-surface-variant": "#434656",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadada",
                        "tertiary-container": "#666868",
                        "on-background": "#1a1c1c",
                        "background": "#f9f9f9",
                        "surface-container-high": "#e8e8e8",
                        "tertiary": "#4e5050",
                        "primary": "#0041c8",
                        "surface-variant": "#e2e2e2",
                        "surface-container-low": "#f3f3f3",
                        "on-secondary-fixed": "#1c1b1b",
                        "outline": "#737688",
                        "primary-fixed": "#dce1ff",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary-fixed-dim": "#b6c4ff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e2e2e2",
                        "on-secondary-container": "#656464",
                        "surface-bright": "#f9f9f9",
                        "error": "#ba1a1a",
                        "surface-tint": "#004dea",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f1f1f1",
                        "on-error": "#ffffff",
                        "primary-container": "#0055ff",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface": "#f9f9f9",
                        "on-primary-fixed-variant": "#0039b3",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474646",
                        "on-primary-fixed": "#001551",
                        "surface-container": "#eeeeee",
                        "on-tertiary-container": "#e7e7e7",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#e5e2e1",
                        "on-primary-container": "#e3e6ff",
                        "on-surface": "#1a1c1c",
                        "secondary-container": "#e5e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "48px",
                        "unit": "4px",
                        "md": "16px",
                        "margin-mobile": "20px",
                        "xxl": "64px",
                        "sm": "8px",
                        "xl": "40px",
                        "gutter": "16px",
                        "xs": "4px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-xl": ["Inter"],
                        "body-md": ["Inter"],
                        "data-metric": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-caps": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "display-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "data-metric": ["20px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col pt-safe pb-safe md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white dark:bg-zinc-950 border-b border-zinc-100 dark:border-zinc-800 transition-colors duration-200">
<div class="flex justify-between items-center w-full px-5 py-3">
<div class="flex items-center gap-3">
<img alt="User profile photo" class="w-8 h-8 rounded-full object-cover" data-alt="A close-up, highly professional studio portrait of an athletic individual. The lighting is crisp and even, highlighting sharp facial features against a clean, neutral background. The aesthetic aligns with a modern, high-end fitness brand, utilizing a balanced, bright palette with subtle depth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAH_JqnQWwcYE99kJ58ah_QXr-C-YvxqJmWNBVch68W6N5nHDlLJV5BzaqBFApyNVFpagOtvD4Y1otcafsnQaZQJCPnoZkyoEdQ5uu0g0bj7ik-ZUGp7F__WeMnAOfsixsF7dB0ImgUjrDaPzll1nDI0yhjzhZlf0j7_J31A0ynndylZFEpUgFaQeeNbDEWbd8dYF41POSqY_8V61S-RGXrLPTwypknDF0lpTZPKuFRwf40OTQ_TtCdJxl06dqrwZUwT2mAC3i_WbI"/>
<span class="text-xl font-['Space_Grotesk'] font-bold tracking-tighter text-zinc-900 dark:text-zinc-50">LuminAI</span>
</div>
<button class="text-zinc-400 dark:text-zinc-500 hover:bg-zinc-50 dark:hover:bg-zinc-900 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[72px] pb-[80px] md:pb-0 px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto w-full">
<!-- Greeting -->
<section class="mt-lg mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-background">Good morning, Alex</h1>
<p class="font-body-md text-body-md text-secondary mt-xs">Let's review your performance today.</p>
</section>
<!-- Daily Stats Bento Grid -->
<section class="grid grid-cols-2 md:grid-cols-3 gap-md mb-xl">
<!-- Steps Card -->
<div class="bg-surface-container-lowest border border-surface-container rounded-xl p-md flex flex-col justify-between">
<div class="flex items-center justify-between mb-md">
<span class="font-label-caps text-label-caps text-secondary uppercase">Steps</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">directions_walk</span>
</div>
<div>
<span class="font-data-metric text-data-metric text-on-background block">8,432</span>
<div class="w-full h-1 bg-surface-container mt-sm rounded-full overflow-hidden">
<div class="h-full bg-primary w-[70%]"></div>
</div>
</div>
</div>
<!-- Calories Card -->
<div class="bg-surface-container-lowest border border-surface-container rounded-xl p-md flex flex-col justify-between">
<div class="flex items-center justify-between mb-md">
<span class="font-label-caps text-label-caps text-secondary uppercase">Calories</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">local_fire_department</span>
</div>
<div>
<span class="font-data-metric text-data-metric text-on-background block">1,240 <span class="text-sm text-secondary">kcal</span></span>
<div class="w-full h-1 bg-surface-container mt-sm rounded-full overflow-hidden">
<div class="h-full bg-primary w-[45%]"></div>
</div>
</div>
</div>
<!-- Active Minutes Card -->
<div class="bg-surface-container-lowest border border-surface-container rounded-xl p-md flex flex-col justify-between col-span-2 md:col-span-1">
<div class="flex items-center justify-between mb-md">
<span class="font-label-caps text-label-caps text-secondary uppercase">Active</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">timer</span>
</div>
<div>
<span class="font-data-metric text-data-metric text-on-background block">45 <span class="text-sm text-secondary">min</span></span>
<div class="w-full h-1 bg-surface-container mt-sm rounded-full overflow-hidden">
<div class="h-full bg-primary w-[80%]"></div>
</div>
</div>
</div>
</section>
<!-- Daily Focus -->
<section class="mb-xxl">
<h2 class="font-headline-md text-headline-md text-on-background mb-md">Daily Focus</h2>
<div class="relative rounded-DEFAULT overflow-hidden bg-surface-container-lowest border border-surface-container">
<div class="absolute inset-0 bg-gradient-to-r from-on-background/80 to-transparent z-10"></div>
<img alt="Lower Body Power Workout" class="w-full h-48 object-cover absolute inset-0 z-0" data-alt="A high-contrast, dramatic shot of an athlete performing a lower body exercise in a modern, minimalist gym. The lighting emphasizes muscle definition and focus, utilizing deep shadows and crisp, cool highlights. The setting features sleek, industrial gym equipment against clean, concrete walls, embodying a serious, performance-driven aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9j-uPLKAlVmMWyod1Wktly4ytdUYpEbMydAot_yJQFZxR9VfAHYa2r11_mKn7akkEUivwFDZTzV6uSttQe9SypOxGmR80P6LO4JimrLoyOpBAqUClCDH3WKDuGtKyXf0_TzQ15V5WiRF22kyosZDPJuYj6ozk9K3mqpaHgbkTdxlGJKytHAioVG-0M-cIKrQq3uqyvs9ke5ZfFPpjOOrCbelcbnSOMkdJhdtLA4YFL9mXOyJur8vVDgTahZeUu8Ok_qaN0isbNbI"/>
<div class="relative z-20 p-lg h-48 flex flex-col justify-end">
<span class="inline-block bg-surface-container-lowest text-on-background font-label-caps text-label-caps px-2 py-1 rounded w-max mb-sm">STRENGTH</span>
<h3 class="font-headline-lg text-headline-lg text-on-primary">Lower Body Power</h3>
<p class="font-body-md text-body-md text-surface-container-low mt-xs">45 Min • High Intensity</p>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe bg-white dark:bg-zinc-950 border-t border-zinc-100 dark:border-zinc-800 transition-all duration-300 ease-in-out">
<button class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 border-t-2 border-blue-600 dark:border-blue-400 pt-2 w-16 hover:text-zinc-900 dark:hover:text-zinc-100">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="text-[10px] font-['Inter'] uppercase tracking-widest font-bold">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600 pt-2 w-16 hover:text-zinc-900 dark:hover:text-zinc-100 border-t-2 border-transparent">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">smart_toy</span>
<span class="text-[10px] font-['Inter'] uppercase tracking-widest font-bold">AI Coach</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600 pt-2 w-16 hover:text-zinc-900 dark:hover:text-zinc-100 border-t-2 border-transparent">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
<span class="text-[10px] font-['Inter'] uppercase tracking-widest font-bold">Workouts</span>
</button>
<button class="flex flex-col items-center justify-center text-zinc-400 dark:text-zinc-600 pt-2 w-16 hover:text-zinc-900 dark:hover:text-zinc-100 border-t-2 border-transparent">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">monitoring</span>
<span class="text-[10px] font-['Inter'] uppercase tracking-widest font-bold">Insights</span>
</button>
</nav>
</body></html>
