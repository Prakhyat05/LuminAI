<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FORM — AI Fitness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Share Tech Mono',monospace;color:#fff}

/* ── Camera Layer ── */
#cam-wrap{position:fixed;inset:0;z-index:1}
#input_video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#overlay{position:absolute;inset:0;z-index:2}

/* ── Scanline effect ── */
#scanlines{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px)}

/* ── HUD ── */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}

.panel{
  position:absolute;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(0,255,136,.25);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px)
}

/* ── Top Bar ── */
#top-bar{
  top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;gap:8px;
  border-top:none;border-left:none;border-right:none;
  border-bottom:1px solid rgba(0,255,136,.2)
}
#ex-label{font-size:9px;letter-spacing:4px;color:rgba(0,255,136,.7);white-space:nowrap}
#timer{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:2px}

/* ── Calorie Block (center top) ── */
#cal-block{text-align:center;flex:1}
#cal-val{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:#fff;line-height:1;display:block}
#cal-lbl{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.4)}

/* ── Arm Side Panels ── */
.arm-panel{
  top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:16px 10px;width:68px
}
#left-panel{left:0;border-left:none;border-radius:0 12px 12px 0}
#right-panel{right:0;border-right:none;border-radius:12px 0 0 12px}
.arm-side-lbl{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.35);text-transform:uppercase}
.arm-rep-count{font-family:'Orbitron',sans-serif;font-size:44px;font-weight:900;line-height:1;text-align:center;
  color:#00ff88;text-shadow:0 0 16px rgba(0,255,136,.4);transition:color .25s,text-shadow .25s}
.arm-rep-count.bad{color:#ff2244;text-shadow:0 0 16px rgba(255,34,68,.45)}
.arm-rep-count.flash{animation:repflash .35s ease-out}
.rep-unit{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.35)}

/* ── Progress Bar ── */
.prog-track{width:10px;height:120px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;display:flex;align-items:flex-end;border:1px solid rgba(255,255,255,.06)}
.prog-fill{width:100%;background:linear-gradient(to top,#00ff88,#00ccff);border-radius:5px;transition:height .08s linear;height:0%}
.prog-fill.bad{background:linear-gradient(to top,#ff2244,#ff8800)}
.angle-num{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:1px}

/* ── Bottom Status ── */
#status-bar{
  bottom:0;left:0;right:0;
  text-align:center;padding:12px 16px;
  border-bottom:none;border-left:none;border-right:none;
  border-top:1px solid rgba(0,255,136,.2)
}
#status-main{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:3px;
  color:#00ff88;transition:color .2s}
#status-main.warn{color:#ff2244;animation:blink .5s ease-in-out 2}
#status-sub{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.35);margin-top:3px}

/* ── Total badge ── */
#total-badge{
  position:absolute;top:64px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.25);white-space:nowrap
}

/* ── Corner Marks ── */
.corner{position:absolute;width:18px;height:18px;pointer-events:none}
.corner.tl{top:14px;left:14px;border-top:2px solid rgba(0,255,136,.4);border-left:2px solid rgba(0,255,136,.4)}
.corner.tr{top:14px;right:14px;border-top:2px solid rgba(0,255,136,.4);border-right:2px solid rgba(0,255,136,.4)}
.corner.bl{bottom:14px;left:14px;border-bottom:2px solid rgba(0,255,136,.4);border-left:2px solid rgba(0,255,136,.4)}
.corner.br{bottom:14px;right:14px;border-bottom:2px solid rgba(0,255,136,.4);border-right:2px solid rgba(0,255,136,.4)}

/* ── Splash Screen ── */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.splash-title{font-family:'Orbitron',sans-serif;font-size:38px;font-weight:900;color:#00ff88;letter-spacing:8px}
.splash-sub{font-size:11px;letter-spacing:4px;color:rgba(255,255,255,.35)}
#start-btn{
  margin-top:12px;
  background:transparent;
  border:1px solid rgba(0,255,136,.6);
  color:#00ff88;
  font-family:'Orbitron',sans-serif;
  font-size:13px;letter-spacing:4px;
  padding:15px 36px;cursor:pointer;
  pointer-events:all;
  transition:background .2s,box-shadow .2s
}
#start-btn:hover{background:rgba(0,255,136,.1);box-shadow:0 0 24px rgba(0,255,136,.25)}
#start-btn:active{transform:scale(.97)}
#splash-status{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.35);text-align:center;padding:0 24px}
#splash-err{font-size:11px;letter-spacing:1px;color:#ff2244;text-align:center;padding:0 24px;display:none}
.ring{width:48px;height:48px;border:2px solid rgba(0,255,136,.15);border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite;display:none}
.splash-tips{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px;text-align:center;line-height:1.9;padding:0 28px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes repflash{0%{transform:scale(1.4)}100%{transform:scale(1)}}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-title">FORM</div>
  <div class="splash-sub">AI FITNESS COACH</div>
  <div class="ring" id="ring"></div>
  <div class="splash-tips">
    BICEP CURL TRACKER<br>
    STAND FACING CAMERA · ARMS VISIBLE<br>
    KEEP ELBOWS TUCKED
  </div>
  <button id="start-btn" onclick="startApp()">ACTIVATE CAMERA</button>
  <div id="splash-status">READY</div>
  <div id="splash-err" id="splash-err"></div>
</div>

<!-- CAMERA -->
<div id="cam-wrap" style="display:none">
  <video id="input_video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
</div>
<div id="scanlines"></div>

<!-- HUD -->
<div id="hud">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Top -->
  <div class="panel" id="top-bar">
    <div id="ex-label">BICEP CURL</div>
    <div id="cal-block">
      <span id="cal-val">0.0</span>
      <span id="cal-lbl">KCAL</span>
    </div>
    <div id="timer">00:00</div>
  </div>
  <div id="total-badge">TOTAL <span id="total-reps">0</span> REPS</div>

  <!-- Left Arm -->
  <div class="panel arm-panel" id="left-panel">
    <div class="arm-side-lbl">LEFT</div>
    <div class="arm-rep-count" id="lreps">0</div>
    <div class="rep-unit">REPS</div>
    <div class="prog-track"><div class="prog-fill" id="lprog"></div></div>
    <div class="angle-num" id="lang">---°</div>
  </div>

  <!-- Right Arm -->
  <div class="panel arm-panel" id="right-panel">
    <div class="arm-side-lbl">RIGHT</div>
    <div class="arm-rep-count" id="rreps">0</div>
    <div class="rep-unit">REPS</div>
    <div class="prog-track"><div class="prog-fill" id="rprog"></div></div>
    <div class="angle-num" id="rang">---°</div>
  </div>

  <!-- Bottom Status -->
  <div class="panel" id="status-bar">
    <div id="status-main">SCANNING</div>
    <div id="status-sub">POSITION YOURSELF IN FRAME</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   VOICE ENGINE — non-blocking, queued
═══════════════════════════════════════════════ */
const Voice = (() => {
  let busy = false;
  const q = [];
  let lastT = 0;

  function tick() {
    if (busy || !q.length) return;
    const { text } = q.shift();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.15; u.pitch = 1.0; u.volume = 1.0;
    u.onend = u.onerror = () => { busy = false; setTimeout(tick, 80); };
    busy = true;
    speechSynthesis.speak(u);
  }

  return {
    say(text, urgent = false) {
      const now = Date.now();
      if (!urgent && now - lastT < 500) return;
      lastT = now;
      if (urgent) {
        q.length = 0;
        if (busy) { speechSynthesis.cancel(); busy = false; }
        q.unshift({ text });
      } else {
        if (q.length < 3) q.push({ text });
      }
      tick();
    }
  };
})();

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
const CAL_PER_REP = 0.32;
let sessionStart = 0;
let totalCal = 0;
let lastFormWarn = 0;

function makeArm() {
  return {
    reps: 0,
    stage: 'idle',   // 'idle' | 'going_up' | 'topped'
    angle: 180,
    visible: false,
    formBad: false,
    formViolated: false,
  };
}
const arms = { L: makeArm(), R: makeArm() };

/* ═══════════════════════════════════════════════
   GEOMETRY
═══════════════════════════════════════════════ */
function angleBetween(a, b, c) {
  const ba = { x: a.x - b.x, y: a.y - b.y };
  const bc = { x: c.x - b.x, y: c.y - b.y };
  const dot = ba.x * bc.x + ba.y * bc.y;
  const mag = Math.sqrt((ba.x**2 + ba.y**2) * (bc.x**2 + bc.y**2));
  if (!mag) return 180;
  return Math.acos(Math.min(1, Math.max(-1, dot / mag))) * 180 / Math.PI;
}

function elbowDrift(shoulder, elbow) {
  /* Horizontal distance in normalised coords.
     >0.13 = elbow has swung away from body alignment */
  return Math.abs(elbow.x - shoulder.x) > 0.13;
}

/* ═══════════════════════════════════════════════
   PER-ARM REP LOGIC
═══════════════════════════════════════════════ */
function processArm(side, sh, el, wr) {
  const arm = arms[side];
  const angle = angleBetween(sh, el, wr);
  arm.angle = angle;
  arm.visible = true;

  const bad = elbowDrift(sh, el);
  arm.formBad = bad;

  /* Track form violation during movement */
  if (arm.stage === 'going_up' && bad) arm.formViolated = true;

  /* Live form warning (throttled) */
  if (bad && arm.stage === 'going_up') {
    const now = Date.now();
    if (now - lastFormWarn > 2800) {
      lastFormWarn = now;
      Voice.say('Tuck your elbow in', true);
    }
  }

  /* ── State machine ── */
  if (angle > 155) {
    if (arm.stage !== 'idle') {
      arm.stage = 'idle';
      arm.formViolated = false;
    }
  } else if (angle < 55 && arm.stage === 'idle') {
    arm.stage = 'going_up';
  } else if (angle < 45 && arm.stage === 'going_up') {
    arm.stage = 'topped';
    if (!arm.formViolated) {
      arm.reps++;
      totalCal = parseFloat((totalCal + CAL_PER_REP).toFixed(2));
      Voice.say(String(arm.reps));
      flashRep(side);
    } else {
      Voice.say('Fix your elbow', true);
    }
  }
}

function flashRep(side) {
  const el = document.getElementById(side === 'L' ? 'lreps' : 'rreps');
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 400);
}

/* ═══════════════════════════════════════════════
   DRAWING
═══════════════════════════════════════════════ */
const GOOD_COLOR = '#00ff88';
const BAD_COLOR  = '#ff2244';
const WHITE      = 'rgba(255,255,255,0.55)';

function drawJoint(ctx, x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, r + 4, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawBone(ctx, x1, y1, x2, y2, color) {
  /* Glow */
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.12;
  ctx.stroke();
  ctx.globalAlpha = 1;
  /* Main line */
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3.5;
  ctx.stroke();
}

function toCanvas(lm, W, H) {
  return { x: lm.x * W, y: lm.y * H, v: lm.visibility || 0 };
}

function drawSkeleton(ctx, lms, W, H) {
  if (!lms || lms.length < 17) return;

  /* Mirror transform to match selfie video */
  ctx.save();
  ctx.translate(W, 0);
  ctx.scale(-1, 1);

  const ls = toCanvas(lms[11], W, H);
  const rs = toCanvas(lms[12], W, H);
  const le = toCanvas(lms[13], W, H);
  const re = toCanvas(lms[14], W, H);
  const lw = toCanvas(lms[15], W, H);
  const rw = toCanvas(lms[16], W, H);

  const lc = arms.L.formBad ? BAD_COLOR : GOOD_COLOR;
  const rc = arms.R.formBad ? BAD_COLOR : GOOD_COLOR;

  const MIN_VIS = 0.45;

  /* Shoulder connector */
  if (ls.v > MIN_VIS && rs.v > MIN_VIS) drawBone(ctx, ls.x, ls.y, rs.x, rs.y, WHITE);

  /* Left arm */
  if (ls.v > MIN_VIS && le.v > MIN_VIS) drawBone(ctx, ls.x, ls.y, le.x, le.y, lc);
  if (le.v > MIN_VIS && lw.v > MIN_VIS) drawBone(ctx, le.x, le.y, lw.x, lw.y, lc);

  /* Right arm */
  if (rs.v > MIN_VIS && re.v > MIN_VIS) drawBone(ctx, rs.x, rs.y, re.x, re.y, rc);
  if (re.v > MIN_VIS && rw.v > MIN_VIS) drawBone(ctx, re.x, re.y, rw.x, rw.y, rc);

  /* Joints */
  if (ls.v > MIN_VIS) drawJoint(ctx, ls.x, ls.y, 7, '#fff');
  if (rs.v > MIN_VIS) drawJoint(ctx, rs.x, rs.y, 7, '#fff');
  if (le.v > MIN_VIS) drawJoint(ctx, le.x, le.y, 9, lc);
  if (re.v > MIN_VIS) drawJoint(ctx, re.x, re.y, 9, rc);
  if (lw.v > MIN_VIS) drawJoint(ctx, lw.x, lw.y, 7, lc);
  if (rw.v > MIN_VIS) drawJoint(ctx, rw.x, rw.y, 7, rc);

  ctx.restore();
}

/* ═══════════════════════════════════════════════
   UI UPDATE (called each frame)
═══════════════════════════════════════════════ */
function updateHUD() {
  /* Calories */
  document.getElementById('cal-val').textContent = totalCal.toFixed(1);

  /* Timer */
  const s = Math.floor((Date.now() - sessionStart) / 1000);
  document.getElementById('timer').textContent =
    String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  /* Totals */
  const total = arms.L.reps + arms.R.reps;
  document.getElementById('total-reps').textContent = total;

  /* Left */
  updateArmUI('L', 'lreps', 'lprog', 'lang');
  /* Right */
  updateArmUI('R', 'rreps', 'rprog', 'rang');

  /* Status */
  const anyBad = arms.L.formBad || arms.R.formBad;
  const anyVisible = arms.L.visible || arms.R.visible;
  const sm = document.getElementById('status-main');
  const ss = document.getElementById('status-sub');

  if (!anyVisible) {
    sm.textContent = 'SCANNING';
    sm.className = '';
    ss.textContent = 'POSITION YOURSELF IN FRAME';
  } else if (anyBad) {
    sm.textContent = '⚠ FIX FORM';
    sm.className = 'warn';
    ss.textContent = 'TUCK YOUR ELBOW AGAINST YOUR BODY';
  } else {
    sm.textContent = total === 0 ? 'TRACKING ACTIVE' : '✓ GOOD FORM';
    sm.className = '';
    ss.textContent = total === 0 ? 'START CURLING' : total + ' TOTAL REPS COMPLETED';
  }

  /* Reset visibility each frame — will be set by processArm */
  arms.L.visible = false;
  arms.R.visible = false;
  arms.L.formBad = false;
  arms.R.formBad = false;
}

function updateArmUI(side, repId, progId, angId) {
  const arm = arms[side];
  const repEl  = document.getElementById(repId);
  const progEl = document.getElementById(progId);
  const angEl  = document.getElementById(angId);

  repEl.textContent = arm.reps;
  repEl.classList.toggle('bad', arm.formBad);

  const pct = arm.visible ? Math.max(0, Math.min(100, ((180 - arm.angle) / 135) * 100)) : 0;
  progEl.style.height = pct + '%';
  progEl.classList.toggle('bad', arm.formBad);

  angEl.textContent = arm.visible ? Math.round(arm.angle) + '°' : '---°';
}

/* ═══════════════════════════════════════════════
   MEDIAPIPE INIT
═══════════════════════════════════════════════ */
async function startApp() {
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('ring').style.display = 'block';
  document.getElementById('splash-status').textContent = 'LOADING AI MODEL…';

  try {
    /* Request camera */
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });

    const videoEl  = document.getElementById('input_video');
    const canvasEl = document.getElementById('overlay');
    const ctx      = canvasEl.getContext('2d');

    videoEl.srcObject = stream;
    await new Promise(r => { videoEl.onloadedmetadata = r; });
    await videoEl.play();

    /* Size canvas to window */
    function resize() {
      canvasEl.width  = window.innerWidth;
      canvasEl.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    /* MediaPipe Pose */
    const pose = new Pose({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      smoothSegmentation: false,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    pose.onResults(results => {
      const W = canvasEl.width;
      const H = canvasEl.height;

      /* Clear canvas — video is mirrored via CSS transform */
      ctx.clearRect(0, 0, W, H);

      if (results.poseLandmarks) {
        const lms = results.poseLandmarks;
        const MIN_VIS = 0.45;

        /* Process left arm (landmarks 11=L.shoulder, 13=L.elbow, 15=L.wrist) */
        if (lms[11].visibility > MIN_VIS && lms[13].visibility > MIN_VIS && lms[15].visibility > MIN_VIS) {
          processArm('L', lms[11], lms[13], lms[15]);
          arms.L.visible = true;
        }

        /* Process right arm (12=R.shoulder, 14=R.elbow, 16=R.wrist) */
        if (lms[12].visibility > MIN_VIS && lms[14].visibility > MIN_VIS && lms[16].visibility > MIN_VIS) {
          processArm('R', lms[12], lms[14], lms[16]);
          arms.R.visible = true;
        }

        /* Draw skeleton */
        drawSkeleton(ctx, lms, W, H);
      }

      updateHUD();
    });

    /* Use Camera utility for optimal frame timing */
    const camera = new Camera(videoEl, {
      onFrame: async () => { await pose.send({ image: videoEl }); },
      width: 640,
      height: 480,
      facingMode: 'user'
    });

    camera.start().then(() => {
      /* Show HUD */
      document.getElementById('splash').style.display = 'none';
      document.getElementById('cam-wrap').style.display = 'block';
      document.getElementById('hud').style.display = 'block';
      sessionStart = Date.now();
      Voice.say('Fitness coach active. Begin your bicep curls.');
    });

  } catch (err) {
    document.getElementById('ring').style.display = 'none';
    document.getElementById('splash-err').style.display = 'block';
    document.getElementById('splash-err').textContent =
      err.name === 'NotAllowedError'
        ? 'Camera access denied. Please allow camera permissions and reload.'
        : 'Camera error: ' + err.message;
    document.getElementById('start-btn').style.display = 'block';
  }
}
</script>
</body>
</html>
